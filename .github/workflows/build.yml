name: Happiness Scanner — build & validate

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows 11 · check, test, MSI
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> src-tauri/target'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Cargo check
        working-directory: src-tauri
        run: |
          cargo check --message-format=short 2>&1 | Tee-Object -FilePath check.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content check.log | Where-Object { $_ -match 'error|note:|within|held across|not Send' } |
              Select-Object -First 150 |
              ForEach-Object { "::error::$($_.Replace('%','%25').Replace("`r",''))" }
            exit 1
          }

      - name: Crypto unit tests
        working-directory: src-tauri
        run: |
          cargo test --message-format=short 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content test.log | Where-Object { $_ -match 'error|FAILED|panicked|assertion|left:|right:' } |
              Select-Object -First 100 |
              ForEach-Object { "::error::$($_.Replace('%','%25').Replace("`r",''))" }
            exit 1
          }

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build MSI installer
        working-directory: src-tauri
        run: |
          cargo tauri build --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log | Where-Object { $_ -match 'error|failed|Error|not found|missing' } |
              Select-Object -First 120 |
              ForEach-Object { "::error::$($_.Replace('%','%25').Replace("`r",''))" }
            exit 1
          }

      - name: List installer artifacts
        working-directory: src-tauri
        run: |
          Get-ChildItem -Recurse -File "target/x86_64-pc-windows-msvc/release/bundle" |
            ForEach-Object { "::notice::$($_.FullName)" }

      - name: Publish GitHub release with installer and checksums
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundle = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $files = @()
          Get-ChildItem "$bundle\nsis\*.exe", "$bundle\msi\*.msi" -ErrorAction SilentlyContinue |
            ForEach-Object { $files += $_.FullName }
          if ($files.Count -eq 0) { throw "No installer artifacts found" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Path checksums.txt -Encoding utf8
          $tag = "${{ github.ref_name }}"
          $notes = "Happiness Scanner $tag`n`nАвтоматический релиз: обновления находятся приложением каждые 60 секунд. Настройки и результаты сохраняются при обновлении.`nSHA-256 контрольные суммы: checksums.txt"
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files checksums.txt --clobber
          } else {
            gh release create $tag --title "Happiness Scanner $tag" --notes $notes $files checksums.txt
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: happiness-scanner-msi
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
