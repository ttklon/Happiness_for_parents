[package]
name = "happiness-scanner"
version = "0.6.4"
description = "Background multi-coin wallet scanner with full anonymity — Rust + Tauri"
authors = ["Happiness Scanner"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Cryptography (versions are pinned to keep one coherent RustCrypto/digest generation)
rand = "=0.8.5"
sha2 = "=0.10.8"
sha3 = "=0.10.8"
ripemd = "=0.1.3"
hmac = "=0.12.1"
pbkdf2 = "=0.12.2"
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
secp256k1 = { version = "=0.29.1", features = ["rand-std"] }
ed25519-dalek = "=2.1.1"

# Network
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
tokio = { version = "1", features = ["full"] }
once_cell = "1"

# Misc
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"

[features]
default = []
